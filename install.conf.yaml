- defaults:
    link:
      relink: true
      create: true
      # Rename a real file or directory to name.dotbot-backup.YYYYMMDD-HHMMSS
      # before replacing it. Existing symlinks are left for relink.
      backup: true

- clean: ['~', '~/bin']

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  -
    command: ./macos/setup-homebrew.sh || echo "⚠️  Homebrew setup had issues, continuing with installation..."
    description: Installing Homebrew and Essential Packages
    stdout: true
    stdin: true
  -
    command: command -v mise >/dev/null 2>&1 && eval "$(mise activate bash)" && echo "✅ Mise initialized for installation session" || echo "⚠️  Mise not found, will be available after shell restart"
    description: Initialize mise for current session
    stdout: true

- link:
    ~/.zshrc:
      path: zsh/zshrc.zsh
      force: true
    ~/.oh-my-zsh: zsh/oh-my-zsh
    ~/.zgenom: zsh/zgenom


    ~/bin:
      glob: true
      path: scripts/*
      relink: true

    ~/.config/fastfetch:
      path: fastfetch
      force: true

    ~/.config/direnv:
      path: direnv
      force: true

    # VS Code MacOS
    ~/Library/Application Support/Code/User:
      if: '[ `uname` = Darwin ]'
      glob: true
      path: vscode/macos/*.json
      force: true

    ~/Library/Application Support/Code/User/snippets:
      if: '[ `uname` = Darwin ]'
      path: vscode/snippets
      force: true

    # Cursor uses the same settings, keybindings, and snippets as VS Code
    ~/Library/Application Support/Cursor/User:
      if: '[ `uname` = Darwin ]'
      glob: true
      path: vscode/macos/*.json
      force: true
      relink: true

    ~/Library/Application Support/Cursor/User/snippets:
      if: '[ `uname` = Darwin ]'
      path: vscode/snippets
      force: true

    ~/.config/mise/config.toml:
      path: mise/config.toml
      force: true

    # GUI git (GitHub Desktop) does not load ~/.zshrc. Husky sources this
    # before hooks so npx resolves through mise shims.
    ~/.config/husky/init.sh:
      path: husky/init.sh
      force: true

    ~/.gitignore:
      path: git/gitignore
      force: true

    ~/.ssh/config:
      path: ssh/config
      force: true

    ~/.cursor/mcp.json:
      path: cursor/mcp.json
      force: true

    ~/.cursor/skills:
      path: cursor/skills
      force: true

    ~/Library/Application Support/iTerm2/DynamicProfiles/profile.json:
      if: '[ `uname` = Darwin ]'
      path: iterm2/profile.json
      force: true

    ~/Library/Application Support/iTerm2/Scripts/AutoLaunch/set-default-profile.py:
      if: '[ `uname` = Darwin ]'
      path: iterm2/set-default-profile.py
      force: true

- shell:
  -
    command: ./scripts/sync-editor-extensions.sh
    description: Installing shared Cursor and VS Code extensions
    stdout: true

- shell:
  -
    command: ./scripts/install-fonts.sh
    description: Installing Operator Mono Nerd Font
    stdout: true

- shell:
  -
    command: ./scripts/install-mise-tools.sh
    description: Installing Node.js and pnpm with mise
    stdout: true


- shell:
  -
    command: ./git/set-gitconfig.sh
    description: Configuring Git
    stdout: true
    quiet: false
  -
    command: ./scripts/sync-iterm-profile.sh
    description: Selecting the synced iTerm profile
    stdout: true
  -
    command: ./scripts/installation-complete.sh
    description: Installation Complete
    stdout: true

